# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
#
# VLMD Subtask 1 — Cognitive Mechanism Classification
#
# Unit of annotation: ONE ARGUMENT — a claim plus only its immediate children.
# Data is built by scripts/build_instances.py; see DESIGN.md for every decision
# and every assumption, and QUESTIONS.md for what is still open.
#
# Scheme names are frozen. Renaming one after annotation starts splits the data
# across the admin view, the agreement report and the export, with no error.
# They have been broken once, deliberately: the mechanisms were flattened from
# `primary_mechanism` + `secondary_mechanisms` into one `mechanisms`
# multiselect, and scripts/migrate_flatten_mechanisms.py is what moves answers
# already stored under the old names. Any further rename needs the same
# treatment.

annotation_task_name: VLMD Subtask 1 — Cognitive Mechanism Classification
task_dir: .
output_annotation_dir: annotation_output/

data_files: [data/instances.json]
item_properties:
  id_key: id
  text_key: claim_content          # never displayed; instance_display drives the page

# ---------------------------------------------------------------------------
# What the annotator sees
# ---------------------------------------------------------------------------
# The meme image is deliberately NOT shown. The argument is the whole item, and
# the `Visual element` children are the only account of the image the annotator
# gets -- which is why build_instances.py renders them first and badges them.
#
instance_display:
  fields:
    - key: argument_html
      type: html                   # built by build_instances.py, escaped there
      label: The argument
  layout:
    direction: vertical
    gap: 16px
  resizable: false                 # no second field to trade width with

base_css: static/study.css
# THE INSTRUCTIONS ARE THE GUIDELINES. Not a link to them, not a summary of
# them -- the whole of `guidelines.md`, rendered as markdown into the banner
# Potato puts above every argument. There is one copy of the definitions and
# the annotator is never more than a click from it.
#
# `annotation_instructions` is NOT set here. scripts/serve.py reads
# guidelines.md at boot and sets it, which is why that script is how the study
# is started: `potato start config.yaml` directly leaves the banner empty.
# Keeping the text here as well would be a second copy of the definitions, and
# two copies of a definition is one copy that is wrong.
#
# Markdown, not HTML: Potato renders `annotation_instructions` as markdown only
# when it contains no block-level HTML tag, and its markdown renderer has no
# table support -- which is why the mechanism table in guidelines.md is written
# as headed entries rather than as a table.
# ---------------------------------------------------------------------------
# The questions
# ---------------------------------------------------------------------------
# NOTE ON `layout`: there is no `layout:` block in this config, and there must
# not be one. Measured on 2.9.3: with ANY `layout` block -- grid alone or grid
# plus groups -- each conditional question is rendered TWICE. The <form> is
# hoisted into the grid and the `display-logic-container` beside it is left
# empty, so the gate toggles an empty div and every gated question is on screen
# permanently, whatever the Sensible Test says. `validate --strict` passes,
# `preview` passes, the boot log says nothing, and the page looks deliberate.
# Without a `layout` block the form nests inside its container and the gate
# works.
# The section headings below are `pure_display` schemes carrying the same gate,
# which is how the three steps survive losing `layout.groups`.
annotation_schemes:

  - annotation_type: pure_display
    name: section_sensible_test
    allow_html: true
    description: >-
      <h4 class="step-head">Step 1 &mdash; Sensible Test</h4>
      <p class="step-sub">Read all three checks, then answer the one question
      below. Any single check coming back Yes is a failed test.</p>
      <div class="check-list"><ol>
      <li><b>Manipulation Check</b> &mdash; Is the creator using emotional
      hijacking, mockery, side-by-side tricks, out-of-context cropping, or coded
      dog-whistles to force this connection in lieu of evidence?</li>
      <li><b>Deception Check</b> &mdash; Does a reader have to accept an unproven
      assumption, a warped timeline, or a structural lie for the child(ren) to
      successfully connect to the claim?</li>
      <li><b>Rhetorical Wrapper Check</b> &mdash; Is the visual format being used
      as a psychological trap to lower the reader's critical thinking, rather
      than as a helpful tool to illustrate data or literal facts?</li>
      </ol></div>
    label_requirement: {required: false}

  # --- 1. The Sensible Test. One yes/no question, asked first, required. ------
  # The three checks are READ, not answered. They are the three check sentences
  # from guidelines.md, word for word, in the pure_display above --
  # scripts/serve.py compares them at boot and prints a warning if they have
  # drifted apart -- and the annotator collapses them into one verdict here.
  #
  # Nothing is recorded per check. `sensible_test` in the export is this answer
  # read the other way round: Yes here is a Fail, No is a Pass.
  # scripts/export_annotations.py does that translation so the two namings
  # cannot drift.

  - annotation_type: radio
    name: sensible_test_failed
    description: >-
      Does this argument fail the Sensible Test? Answer Yes if any one of the
      three checks above is a Yes.
    labels:
      - {name: 'Yes', key_value: 'q'}
      - {name: 'No', key_value: 'a'}
    humanize_labels: false
    label_requirement: {required: true}
    horizontal: true

  # --- 2. Mechanisms. Shown only when the Sensible Test came back failed. ----
  # One condition, so the default `logic: all` is the whole of it; there is no
  # `logic: any` here any more, and adding a second condition without one would
  # silently AND the two.
  #
  # FLAT, not primary-and-secondary. There is one list of mechanisms and every
  # one at work in the argument is ticked in it; nothing ranks them. A failed
  # Sensible Test means at least one is present, which is why the multiselect
  # is `required: true` -- the only scheme of its type in this config that is.

  - annotation_type: pure_display
    name: section_mechanism
    allow_html: true
    description: >-
      <h4 class="step-head">Step 2 &mdash; Mechanisms</h4>
      <p class="step-sub">The argument failed the Sensible Test, so at least one
      mechanism is present. Tick every mechanism at work, and say for each one
      how it works. There is no ranking between them.</p>
    label_requirement: {required: false}
    display_logic:
      show_when:
        - {schema: sensible_test_failed, operator: equals, value: 'Yes'}

  - annotation_type: multiselect
    name: mechanisms
    description: >-
      Mechanisms — tick every one at work in getting a reader from these
      children to this claim. At least one, since the Sensible Test came back
      failed.
    labels:
      - {name: 'Affective Hijacking', key_value: '1'}
      - {name: 'Episodic Overgeneralization', key_value: '2'}
      - {name: 'Spurious Causal Correlation', key_value: '3'}
      - {name: 'Satirical Trivialization', key_value: '4'}
      - {name: 'Esoteric Code Activation', key_value: '5'}
      - {name: 'Spurious Legitimacy Signaling', key_value: '6'}
    humanize_labels: false
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: sensible_test_failed, operator: equals, value: 'Yes'}

  # One justification per mechanism, gated on that mechanism being ticked.
  # `contains` tests membership of the multiselect's stored list.
  #
  # Kept short: the box is one column of a three-column grid, and a long
  # placeholder is clipped mid-sentence there.

  - annotation_type: text
    name: justification_affective_hijacking
    description: 'Affective Hijacking: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Affective Hijacking'}

  - annotation_type: text
    name: justification_episodic_overgeneralization
    description: 'Episodic Overgeneralization: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Episodic Overgeneralization'}

  - annotation_type: text
    name: justification_spurious_causal_correlation
    description: 'Spurious Causal Correlation: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Spurious Causal Correlation'}

  - annotation_type: text
    name: justification_satirical_trivialization
    description: 'Satirical Trivialization: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Satirical Trivialization'}

  - annotation_type: text
    name: justification_esoteric_code_activation
    description: 'Esoteric Code Activation: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Esoteric Code Activation'}

  - annotation_type: text
    name: justification_spurious_legitimacy_signaling
    description: 'Spurious Legitimacy Signaling: what is being used, and what move does it make?'
    multiline: true
    rows: 2
    min_chars: 15
    placeholder: 'What is used, and what move does it make?'
    label_requirement: {required: true}
    display_logic:
      show_when:
        - {schema: mechanisms, operator: contains, value: 'Spurious Legitimacy Signaling'}

  # --- 3. Always shown -------------------------------------------------------
  # NO HEADING over these two. There was a `section_record` pure_display here
  # reading "Step 3 -- Anything else", and it rendered wrong: with no `layout`
  # block the forms flow in a grid, and a heading is a form like any other, so
  # it landed in a column BESIDE the last justification box instead of above
  # Notes. Steps 1 and 2 are headings over a gate -- Step 2's appears and
  # disappears with the questions under it, which is what earns them. Notes and
  # the flag are always on screen and say what they are in their own labels.

  - annotation_type: text
    name: notes
    description: >-
      Notes — anything worth recording that the questions above have no room for.
      Optional.
    multiline: true
    rows: 2
    label_requirement: {required: false}   # explicit; see the note near require_fully_annotated below

  - annotation_type: multiselect
    name: flag_for_discussion
    description: Flag this argument for discussion.
    labels:
      - {name: 'Flag for discussion', key_value: 'f'}
    humanize_labels: false
    label_requirement: {required: false}   # explicit; see the note near require_fully_annotated below

# ---------------------------------------------------------------------------
# Assignment
# ---------------------------------------------------------------------------
# Every annotator is handed the WHOLE corpus, in one order -- memes in the order
# of args_0911.json, each meme's arguments bottom up so its root claim C0 is
# read after the arguments that hold it up -- and who does which stretch of it
# is settled between people rather than by the software: "you start at 500".
# That is one decision with several consequences, so they are all written down
# here.
#
# * `max_annotations_per_user` is NOT set. Unset means the per-user quota is the
#   item count, and under `fixed_order` Potato hands out the whole remaining
#   quota in one go -- so each annotator's ordering is all 1621 arguments, in
#   reading order, from their first page. That is what makes the navbar's "Go
#   to" box reach any argument, and it is why the number printed on the
#   argument and the navbar's "Instance #" are the same number for everybody
#   (the line in args_0911.json is `source_index`; the manifest maps the two). Setting a positive cap here would hand out a contiguous block
#   instead and break that correspondence; setting -1 hands out ONE item at a
#   time and "Go to 500" then has nothing to go to.
#
# * `num_annotators_per_item.default` has to be at least the roster size for
#   that to work. An item counts an annotator who merely holds it, so with the
#   old default of 1 the first annotator to arrive saturated all 1621 and every
#   later annotator was served nothing. 10 is a roster size nobody will reach;
#   it is a ceiling, not a target. Nothing assigns two people the same argument
#   -- you do, by giving them overlapping stretches, which is also now the way
#   to collect agreement data.
#
# * No `instance_reclaim`. It existed to take back items held by somebody who
#   walked away, which mattered only while a hold could starve another
#   annotator. Holds no longer block anybody, so there is nothing to reclaim.
num_annotators_per_item:
  default: 10

# The order is the order of data/instances.json: memes in args_0911.json order,
# each meme bottom up. `random` here would shuffle it and there would be no
# number to tell anybody.
assignment_strategy: fixed_order

# NOT SET: `require_fully_annotated: true`.
#
# It stamps `label_requirement: {required: true}` onto every scheme that does
# not declare one, and it reaches schemes that cannot be answered. Measured
# while there were three `pure_display` section headings: with it on, all three
# became required; the CLIENT renders no input for them so Next stayed enabled,
# and the SERVER refused every save with `Required annotation(s) not completed:
# section_sensible_test, section_record` in a corner toast naming internal
# scheme names. The annotator is stuck on item one with no visible question to
# answer. It also silently made Notes and the discussion flag mandatory.
#
# So every scheme above declares `label_requirement` explicitly instead.
# ADDING A SCHEME? Give it a `label_requirement`. Without one it is optional,
# and nothing will warn you.
#
# DRAFTS. `required: true` above means "needed before this argument counts as
# done", not "needed before you may move on". scripts/serve.py relaxes the
# navigation check at boot so an annotator can leave an argument half-answered
# and come back to it; what they typed is already saved. The badge in the
# navbar reads `In Progress` for such an argument and the progress counter does
# not count it. The two arrow buttons beside the counter are a scroll and not a
# filter: they step to the argument before and the argument after, finished ones
# included, and the badge says which kind you landed on. See the header of
# scripts/serve.py.

agreement_metrics: {enabled: true}

# ---------------------------------------------------------------------------
# Phases
# ---------------------------------------------------------------------------
# One phase: annotation. No consent (internal, IRB-exempt lab annotation, per
# the brief), no training round (annotators are trained before they get the
# link), and no instructions phase -- the guidelines are the banner on every
# argument, not two pages before the first one.
#
# A phase named in `order` with no block of its own is dropped at boot with one
# ERROR line, which reads like a broken config; if a practice round is ever
# wanted back, the `training:` block and its data file have to return together.
phases:
  order: [annotation]
  annotation: {type: annotation}

# ---------------------------------------------------------------------------
# Accounts
# ---------------------------------------------------------------------------
# NO PASSWORDS. An annotator types their NetID and is in; Potato creates the
# account the first time it sees one. They type the same NetID next time and
# land on the argument they left.
#
# THE NETID IS THE WHOLE CREDENTIAL. Anyone with the study link who knows
# somebody's NetID can continue as them. That is the accepted trade for a small
# internal study with a known roster: passwords meant a reset flow, a mailbox
# to run it, and people locked out of a week's annotation by a forgotten
# string. Somebody who forgets which NetID they used is looked up in
# annotation_output/. To put passwords back, set require_password to true --
# the sign-in page grows a password field, a Register tab and a reset link on
# its own, and scripts/accounts.py stops closing the two endpoints.
#
# `allow_all_users: true` is what lets a NetID that has never been seen sign
# in at all; with it false, only names listed under `users:` could.
login: {type: none}
require_password: false
user_config:
  allow_all_users: true
authentication:
  user_config_path: annotation_output/user_config.json   # on the Railway volume; survives redeploys

# The sign-in page's own words. The second line under the field -- "For UTD
# students, use your lowercase NetID" -- has no ui_language key and is patched
# into the template by scripts/accounts.py.
ui_language:
  login_subtitle_username: Please enter your NetID to continue
  username_label: NetID
  username_placeholder: e.g. abc123456
  continue_button: Continue

# ---------------------------------------------------------------------------
# Export
# ---------------------------------------------------------------------------
# Potato's own csv/jsonl are a safety net, not the deliverable: they are one
# sparse column per scheme-and-label and carry no item fields and no derived
# pass/fail. scripts/export_annotations.py writes the downstream schema.
export_annotation_format: [csv, jsonl]
auto_export_interval: 3600

# ---------------------------------------------------------------------------
# Session and keys
# ---------------------------------------------------------------------------
# Without secret_key, a random one is generated per process and every annotator
# is logged out on every redeploy. Both support ${VAR} substitution.
secret_key: ${POTATO_SECRET_KEY}
admin_api_key: ${POTATO_ADMIN_API_KEY}
# Not in effect: scripts/accounts.py signs annotators in with a cookie that
# ends when the browser closes, so they type their NetID each time.
session_lifetime_days: 14

# ---------------------------------------------------------------------------
# Adjudication (Potato's built-in)
# ---------------------------------------------------------------------------
# efy220000 can open /adjudicate on the study site and resolve disagreements
# there. They keep annotating as before: Potato only sends an adjudicator to
# /adjudicate on its own when they have nothing left to annotate. The page is
# not linked from anywhere -- give them the URL.
#
# threshold 1.0: anything short of every annotator giving the same answer is
# queued. Free text (justifications, notes) is not compared. Decisions go to
# annotation_output/adjudication/decisions.json; nobody's answers change.
adjudication:
  enabled: true
  adjudicator_users: [efy220000]
  min_annotations: 2
  agreement_threshold: 1.0
